name: fight
 
on:
  issues:
    types: [opened]
 
permissions:
  contents: write
  issues: write
 
concurrency:
  group: readme-update
  cancel-in-progress: false
 
jobs:
  fight:
    if: startsWith(github.event.issue.title, 'fight')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: こうげき
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: python scripts/monster.py --fight "$PLAYER"
 
      - name: README を コミット
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python scripts/monster.py --fight "$PLAYER"
            git add README.md state.json
            git diff --cached --quiet && exit 0
            git commit -m "⚔️ $PLAYER attacked"
            git push origin main && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
 
      - name: Issue を とじる
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "⚔️ Attack landed! Check the profile to see the enemy's HP: https://github.com/$GITHUB_REPOSITORY_OWNER"
